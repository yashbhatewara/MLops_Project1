columns:
  - id: int
  - Gender: category
  - Age: int
  - Driving_License: int
  - Region_Code: float
  - Previously_Insured: int
  - Vehicle_Age: category
  - Vehicle_Damage: category
  - Annual_Premium: float
  - Policy_Sales_Channel: float
  - Vintage: int
  - Response: int


numerical_columns:
  - Age
  - Driving_License
  - Region_Code
  - Previously_Insured
  - Annual_Premium
  - Policy_Sales_Channel
  - Vintage
  - Response

categorical_columns:
  - Gender
  - Vehicle_Age
  - Vehicle_Damage

drop_columns: id

# for data transformation
num_features:   # Columns to apply StandardScaler
  - Age
  - Vintage


mm_columns:     # Columns to apply MinMaxScaler
  - Annual_Premium

# Columns that pass through without scaling (already binary/encoded)
passthrough_columns:
  - Gender
  - Driving_License
  - Region_Code
  - Previously_Insured
  - Policy_Sales_Channel
  - Vehicle_Age_lt_1_Year
  - Vehicle_Age_gt_2_Years
  - Vehicle_Damage_Yes